name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Quality gate: lint + type check
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # functions/ is not covered by tsconfig, so verify it bundles here.
      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --outdir .wrangler/functions-check

      - name: SEO validation (unit tests for hreflang + JSON-LD)
        run: node --test tests/seo-*.test.ts

  # Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      - name: Run tests
        run: npm run test

  # Build + deploy (no prerender — fast for all PRs)
  build-deploy:
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      # Build steps without prerender.mjs — saves ~4 hrs per PR.
      # prerender runs separately in `prerender` job (main push only, 5x concurrent).
      - name: Build (skip prerender)
        run: |
          npm run build:pdf
          node scripts/prerender-routes.mjs
          npx tsc -b
          npx vite build
          node scripts/generate-sitemap.mjs
        env:
          CI: "true"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply share-pool --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: github.event_name == 'push'

      # Upload dist/ as artifact so the prerender job can download it.
      # wrangler-action deploys directly to Cloudflare but does not expose
      # an artifact that download-artifact can find.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist
          retention-days: 1
        if: github.event_name == 'push'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=build-better --commit-dirty=true
        if: github.event_name == 'push'

  # Prerender runs only on main push — 5 concurrent Chrome tabs → ~20 min vs 5+ hrs serial.
  # Cloudflare Pages serves prerendered HTML with Helmet <head> tags for full SEO.
  prerender:
    runs-on: ubuntu-latest
    needs: [build-deploy]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Cache node_modules + puppeteer's downloaded Chrome binary so we skip
      # both the install (~30s) and the ~120MB Chrome download (~30s) on warm
      # runs. Key on package.json since package-lock.json is gitignored.
      - name: Cache node_modules and Chrome
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ${{ runner.home }}/.cache/puppeteer
          key: ${{ runner.os }}-node24-deps-${{ hashFiles('package.json', '.github/workflows/cloudflare-pages.yml') }}
          restore-keys: |
            ${{ runner.os }}-node24-deps-

      - name: Install dependencies (puppeteer needed)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --no-audit

      # Self-heal the Chrome cache. The actions/cache step above may restore
      # node_modules alongside a Chrome directory whose binary is missing or
      # stale: puppeteer's postinstall silently swallows download errors
      # (install.mjs: console.warn then exits 0), so a previous run can
      # have cached an empty ~/.cache/puppeteer. `puppeteer browsers
      # install chrome` is idempotent — it returns immediately when the
      # binary is present, downloads only when missing, and fails loudly
      # (unlike the silent postinstall) if the network is down.
      - name: Ensure Chrome for Puppeteer is installed
        run: npx puppeteer browsers install chrome

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: Run prerender (5 concurrent tabs)
        run: node scripts/prerender.mjs
        env:
          PRERENDER_CONCURRENCY: 10

      - name: Deploy prerendered pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=build-better --commit-dirty=true
