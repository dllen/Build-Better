name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Quality gate: lint + type check
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package.json

      - name: Install dependencies
        run: npm install

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

  # Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package.json

      - name: Install dependencies
        run: npm install

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      - name: Run tests
        run: npm run test

  # Build and deploy
  build-deploy:
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package.json

      - name: Install dependencies
        run: npm install

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action reads wrangler.toml, so [[kv_namespaces]] SHORT_URLS binding is applied automatically.
          # Push to main → production (uses `id`). Pull request → preview (uses `preview_id`).
          command: pages deploy dist --project-name=build-better --commit-dirty=true
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
