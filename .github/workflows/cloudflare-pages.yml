name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Quality gate: lint + type check
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # functions/ is not covered by tsconfig, so verify it bundles here.
      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --outdir .wrangler/functions-check

  # Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      - name: Run tests
        run: npm run test

  # Build + deploy (no prerender — fast for all PRs)
  build-deploy:
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Download sensitive words
        run: node scripts/download-sensitive-words.mjs

      # Build steps without prerender.mjs — saves ~4 hrs per PR.
      # prerender runs separately in `prerender` job (main push only, 5x concurrent).
      - name: Build (skip prerender)
        run: |
          npm run build:pdf
          node scripts/prerender-routes.mjs
          npx tsc -b
          npx vite build
          node scripts/generate-sitemap.mjs
        env:
          CI: "true"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply share-pool --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: github.event_name == 'push'

      # Upload dist/ as artifact so the prerender job can download it.
      # wrangler-action deploys directly to Cloudflare but does not expose
      # an artifact that download-artifact can find.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist
          retention-days: 1
        if: github.event_name == 'push'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=build-better --commit-dirty=true
        if: github.event_name == 'push'

  # Prerender runs only on main push — 5 concurrent Chrome tabs → ~20 min vs 5+ hrs serial.
  # Cloudflare Pages serves prerendered HTML with Helmet <head> tags for full SEO.
  prerender:
    runs-on: ubuntu-latest
    needs: [build-deploy]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies (puppeteer needed)
        run: npm install --legacy-peer-deps --no-audit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: Run prerender (5 concurrent tabs)
        run: node scripts/prerender.mjs
        env:
          PRERENDER_CONCURRENCY: 5

      - name: Deploy prerendered pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=build-better --commit-dirty=true
