name = "build-better"
pages_build_output_dir = "dist"
compatibility_date = "2024-04-01"

# Short URL KV (free tier: 100k reads/day, 1k writes/day)
[[kv_namespaces]]
binding = "SHORT_URLS"
id = "32125ac318d34b39b7a44c3cb0c0bb82"
preview_id = "32125ac318d34b39b7a44c3cb0c0bb82"

# SharePool D1 (create: wrangler d1 create share-pool)
[[d1_databases]]
binding = "SHARE_POOL_DB"
database_name = "share-pool"
database_id = "eb9155e0-73e2-44dc-b702-e737512319ad"
